name: Deploy released documentation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to deploy
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-14
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Require a published release with installer assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must be a version such as v1.0.0"
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/pages-release.json"; then
            echo "::error::Publish release $RELEASE_TAG and its installer assets before deploying documentation"
            exit 1
          fi
          if ! jq -e --arg tag "$RELEASE_TAG" '
            .draft == false and .published_at != null and .tag_name == $tag and
            ([.assets[] | select(.state == "uploaded" and .size > 0) | .name] as $assets |
              ["mlx-bun-\($tag)-arm64.tar.gz", "mlx-bun-\($tag)-arm64.tar.gz.sha256",
               "mlx-bun-arm64.tar.gz", "mlx-bun-arm64.tar.gz.sha256"] |
              all(.[]; . as $name | $assets | index($name) != null))
          ' "$RUNNER_TEMP/pages-release.json" > /dev/null; then
            echo "::error::Release $RELEASE_TAG must be published and include both versioned and installer archives with checksums"
            exit 1
          fi
          if ! latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'); then
            echo "::error::A latest release is required because the installer downloads from releases/latest"
            exit 1
          fi
          if [[ "$latest" != "$RELEASE_TAG" ]]; then
            echo "::error::Release $RELEASE_TAG must be latest before deployment; the installer currently selects $latest"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - name: Require matching application version
        shell: bash
        run: |
          version=$(jq -er '.version' apps/mlx-bun/package.json)
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "::error::Application version $version does not match release $RELEASE_TAG"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/configure-pages@v6.0.0
      - run: bun install --frozen-lockfile
      - name: Build documentation from the release revision
        run: GITHUB_SHA=$(git rev-parse HEAD) bun run --cwd apps/website build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/website/dist
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
